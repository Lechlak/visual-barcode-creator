<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print Location Data</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #1a1a1a;
      padding: 20px;
    }

    .card {
      width: min(1080px, 96vw);
      margin: 0 auto;
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,.08);
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      background: #0066ff;
      color: #fff;
    }

    .patron {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 2px solid #d8deee;
      page-break-inside: avoid;
    }

    .patron-head {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }

    .badge {
      font-size: .85rem;
      color: #4a4a4a;
      background: #e0e5f0;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .barcode-item {
      text-align: center;
      margin-bottom: 16px;
      page-break-inside: avoid;
    }

    hr.patron-separator {
      border: none;
      border-top: 2px dashed #aab4cc;
      margin: 20px 0 0;
    }

    #loading {
      text-align: center;
      color: #666;
      font-style: italic;
      margin: 20px 0;
    }

    #error {
      color: #b00020;
      text-align: center;
      margin: 20px 0;
      font-weight: bold;
    }

    @media print {
      .no-print {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }

      body {
        background: #fff !important;
        padding: 0;
        margin: 0;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .card {
        box-shadow: none !important;
        padding: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
      }

      svg {
        display: block !important;
        margin: 0 auto;
      }

      .barcode-item {
        page-break-inside: avoid;
      }

      .patron {
        page-break-inside: avoid;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="no-print" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h1 style="margin:0;">
        Barcodes for - <span id="locationTitle"></span>
      </h1>

      <button type="button" onclick="printPage()">
        Print Page
      </button>
    </div>

    <div style="margin-bottom:15px; font-weight:bold; color:#0066ff; font-size:1.2em;">

      <div class="no-print" style="display:none;">
        <label for="locationSelect">Location:</label>

        <select
          id="locationSelect"
          style="
            width:auto;
            padding:5px;
            font-size:1em;
            font-weight:bold;
            border:1px solid #0066ff;
            color:#0066ff;
            border-radius:5px;
          "
        >
          <option value="Birmingham">Birmingham</option>
          <option value="Heatherdowns">Heatherdowns</option>
          <option value="Holland">Holland</option>
          <option value="Kent">Kent</option>
          <option value="King Road">King Road</option>
          <option value="Lagrange">Lagrange</option>
          <option value="Locke">Locke</option>
          <option value="Main Library">Main Library</option>
          <option value="Maumee">Maumee</option>
          <option value="Mobile Services">Mobile Services</option>
          <option value="Mott">Mott</option>
          <option value="Oregon">Oregon</option>
          <option value="Point Place">Point Place</option>
          <option value="Reynolds Corners">Reynolds Corners</option>
          <option value="Sanger">Sanger</option>
          <option value="South">South</option>
          <option value="Sylvania">Sylvania</option>
          <option value="Washington">Washington</option>
          <option value="Waterville">Waterville</option>
          <option value="West Toledo">West Toledo</option>
        </select>
      </div>

      <div
        id="locationPrintText"
        class="print-only"
        style="display:none;"
      ></div>
    </div>

    <div id="loading">
      Loading data from database...
    </div>

    <div id="error"></div>

    <section id="patronsWrap"></section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);

    let locationParam =
      urlParams.get('location') || 'Birmingham';

    const locationSelect =
      document.getElementById('locationSelect');

    const locationPrintText =
      document.getElementById('locationPrintText');

    const locationTitle =
      document.getElementById('locationTitle');

    // Initialize location title
    locationTitle.textContent = locationParam;

    // Initialize select options
    let optionExists =
      Array.from(locationSelect.options).some(
        opt => opt.value === locationParam
      );

    if (!optionExists && locationParam) {
      const newOption =
        document.createElement('option');

      newOption.value = locationParam;
      newOption.textContent = locationParam;

      locationSelect.appendChild(newOption);
    }

    locationSelect.value = locationParam;

    locationPrintText.textContent =
      `Location: ${locationParam}`;

    locationSelect.addEventListener('change', (e) => {

      locationParam = e.target.value;

      const newUrl = new URL(window.location);

      newUrl.searchParams.set(
        'location',
        locationParam
      );

      window.history.pushState({}, '', newUrl);

      locationPrintText.textContent =
        `Location: ${locationParam}`;

      locationTitle.textContent =
        locationParam;

      // Reset UI
      document.getElementById('patronsWrap').innerHTML = '';
      document.getElementById('error').textContent = '';
      document.getElementById('loading').style.display = 'block';

      fetchData();
    });

    // Better print handling
    function printPage() {

      const loading =
        document.getElementById('loading');

      // Prevent printing while loading
      if (loading.style.display !== 'none') {
        alert('Please wait until all barcodes finish loading.');
        return;
      }

      const svgs =
        document.querySelectorAll('svg');

      if (svgs.length === 0) {
        alert('No barcodes available to print.');
        return;
      }

      // Give browser time to fully render SVGs
      requestAnimationFrame(() => {

        setTimeout(() => {

          window.print();

        }, 500);

      });
    }

    fetchData();

    async function fetchData() {

      try {

        const response = await fetch(
          `/.netlify/functions/get-location-data?location=${encodeURIComponent(locationParam)}`
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.error || 'Server error'
          );
        }

        document.getElementById('loading').style.display =
          'none';

        renderData(result.data);

      } catch (err) {

        console.error(err);

        document.getElementById('loading').style.display =
          'none';

        document.getElementById('error').textContent =
          'Failed to load data: ' + err.message;
      }
    }

    function renderData(rows) {

      const patronsWrap =
        document.getElementById('patronsWrap');

      if (!rows || rows.length === 0) {

        patronsWrap.innerHTML =
          '<p style="text-align:center;">No barcode data found for this location.</p>';

        return;
      }

      // Group by patron
      const patronsMap = new Map();

      rows.forEach(row => {

        const key =
          `${row.patron_name || ''}_${row.patron_code || ''}`;

        if (!patronsMap.has(key)) {

          patronsMap.set(key, {
            name: row.patron_name,
            code: row.patron_code,
            created_at: row.created_at,
            patronBarcodes: [],
            items: []
          });

        }

        const patron =
          patronsMap.get(key);

        if (row.is_patron_barcode) {

          patron.patronBarcodes.push({
            value: row.barcode_value,
            format: row.barcode_type
          });

        } else {

          patron.items.push({
            value: row.barcode_value,
            format: row.barcode_type
          });
        }
      });

      // Render patrons
      patronsMap.forEach((patron) => {

        const section =
          document.createElement('section');

        section.className = 'patron';

        const head =
          document.createElement('div');

        head.className = 'patron-head';

        const badge =
          document.createElement('span');

        badge.className = 'badge';

        badge.textContent =
        `${patron.name || 'Patron'} (${patron.code || 'No Code'}) • Created: ${
          patron.created_at
            ? new Date(patron.created_at).toLocaleDateString()
            : 'Unknown'
        }`;

        head.appendChild(badge);

        section.appendChild(head);

        // Patron barcodes
        patron.patronBarcodes.forEach((entry) => {

          if (!entry.value) return;

          const wrap =
            document.createElement('div');

          wrap.className = 'barcode-item';

          const svg =
            document.createElementNS(
              'http://www.w3.org/2000/svg',
              'svg'
            );

          try {
            JsBarcode(svg, entry.value.trim(), {
              format: entry.format || 'CODE39',
              lineColor: '#000',
              width: 2,
              height: 80,
              margin: 12,
              displayValue: true
            });

            wrap.appendChild(svg);
            section.appendChild(wrap);
          } catch (err) {
            console.error(
              'Patron barcode render failed:',
              entry,
              err
            );
          }
        });

        // Item barcodes
        patron.items.forEach((entry) => {

          if (!entry.value) return;

          const item =
            document.createElement('div');

          item.className = 'barcode-item';

          const svg =
            document.createElementNS(
              'http://www.w3.org/2000/svg',
              'svg'
            );

          try {

            JsBarcode(svg, entry.value, {
              format: entry.format || 'CODE39',
              lineColor: '#000',
              width: 2,
              height: 80,
              margin: 12,
              displayValue: true
            });

            item.appendChild(svg);

            section.appendChild(item);

          } catch (err) {

            console.error(
              'Barcode render failed:',
              entry,
              err
            );
          }
        });

        patronsWrap.appendChild(section);
      });
    }
  </script>

</body>
</html>
