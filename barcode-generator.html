<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Barcode Creator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1a1a1a; padding: 20px; }
    .card { width: min(1080px, 96vw); margin: 0 auto; background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 8px 25px rgba(0,0,0,.08); }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #b7bfd1; border-radius: 10px; box-sizing: border-box; }
    .controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
    button { padding:10px 14px; border:0; border-radius:10px; cursor:pointer; font-weight:600; background:#0066ff; color:#fff; }
    button.secondary { background:#5c657a; }
    .error { min-height: 1.2em; margin-top: 10px; color:#b00020; }
    .patron { margin-top: 18px; padding-top: 16px; border-top: 2px solid #d8deee; }
    .patron-head { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
    .patron-head input { max-width: 240px; }
    .badge { font-size:.85rem; color:#4a4a4a; }
    .barcode-item { text-align:center; margin-bottom:16px; page-break-inside: avoid; }
    hr.patron-separator { border:none; border-top:2px dashed #aab4cc; margin:20px 0 0; }
    .history { margin-top: 18px; border-top: 1px solid #e0e5f0; padding-top: 12px; }
    @media print { .no-print { display:none !important; } .card { box-shadow:none; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Visual Barcode Creator</h1>
    <p>Data is separated by location. Select location, then add patrons and item barcodes. Export CSV per location for records.</p>

    <div class="no-print">
      <div class="row">
        <select id="locationSelect"></select>
        <input id="patronCodeInput" type="text" placeholder="Patron # / Barcode" />
        <input id="patronNameInput" type="text" placeholder="Patron name" />
        <input id="barcodeInput" type="text" placeholder="Scan item barcode" />
      </div>
      <div class="row" style="margin-top:10px; grid-template-columns: 1fr 1fr 1fr 1fr;">
        <select id="barcodeFormatInput">
          <option value="CODE128">CODE128</option>
          <option value="CODE39">CODE39</option>
        </select>
      </div>

      <div class="controls">
        <button id="addPatronBtn" type="button" class="secondary">Add Patron</button>
        <button id="addBarcodeBtn" type="button">Add Barcode Item</button>
        <button id="exportCsvBtn" type="button" class="secondary">Export CSV (Location)</button>
        <button id="exportWordBtn" type="button" class="secondary">Export Word (.doc)</button>
        <button id="printBtn" type="button" class="secondary">Print / Save PDF</button>
        <button id="clearLocationBtn" type="button" class="secondary">Clear Current Location</button>
      </div>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </div>

    <section id="patronsWrap"></section>
    <section class="history no-print"><h2>Running Log (current location)</h2><ol id="historyList"></ol></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script>
    const LOCATIONS = Array.from({ length: 20 }, (_, i) => `Location ${i + 1}`);
    const STORAGE_KEY = 'barcode_creator_location_data';

    const locationSelect = document.getElementById('locationSelect');
    const patronCodeInput = document.getElementById('patronCodeInput');
    const patronNameInput = document.getElementById('patronNameInput');
    const barcodeInput = document.getElementById('barcodeInput');
    const barcodeFormatInput = document.getElementById('barcodeFormatInput');
    const addPatronBtn = document.getElementById('addPatronBtn');
    const addBarcodeBtn = document.getElementById('addBarcodeBtn');
    const exportCsvBtn = document.getElementById('exportCsvBtn');
    const exportWordBtn = document.getElementById('exportWordBtn');
    const printBtn = document.getElementById('printBtn');
    const clearLocationBtn = document.getElementById('clearLocationBtn');
    const patronsWrap = document.getElementById('patronsWrap');
    const historyList = document.getElementById('historyList');
    const error = document.getElementById('error');

    function getAllData() {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      LOCATIONS.forEach((loc) => { if (!data[loc]) data[loc] = { patrons: [], history: [] }; });
      return data;
    }
    function saveAllData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    function currentLocation() { return locationSelect.value; }
    function locationData() { return getAllData()[currentLocation()]; }

    function addHistory(msg) {
      const data = getAllData();
      const loc = currentLocation();
      data[loc].history.unshift(`${new Date().toLocaleString()}: ${msg}`);
      data[loc].history = data[loc].history.slice(0, 80);
      saveAllData(data);
      renderHistory();
    }

    function renderHistory() {
      const { history } = locationData();
      historyList.innerHTML = '';
      history.forEach((line) => { const li = document.createElement('li'); li.textContent = line; historyList.appendChild(li); });
    }

    function renderPatrons() {
      const { patrons } = locationData();
      patronsWrap.innerHTML = '';
      patrons.forEach((patron, index) => {
        const section = document.createElement('section'); section.className = 'patron';
        const head = document.createElement('div'); head.className = 'patron-head';

        const codeEdit = document.createElement('input'); codeEdit.value = patron.patronCode || ''; codeEdit.placeholder = 'Patron # / Barcode';
        codeEdit.addEventListener('change', () => updatePatron(index, { patronCode: codeEdit.value }));
        const nameEdit = document.createElement('input'); nameEdit.value = patron.patronName || ''; nameEdit.placeholder = 'Patron name';
        nameEdit.addEventListener('change', () => updatePatron(index, { patronName: nameEdit.value }));
        const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = `Patron group ${patrons.length - index} (${currentLocation()})`;

        head.append(codeEdit, nameEdit, badge); section.appendChild(head);

        if (patron.patronCode && /^\d+$/.test(patron.patronCode.trim())) {
          const wrap = document.createElement('div'); wrap.className = 'barcode-item';
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          JsBarcode(svg, patron.patronCode.trim(), { format: patron.patronFormat || 'CODE128', lineColor: '#000', width: 2, height: 80, margin: 12, displayValue: true });
          wrap.appendChild(svg); section.appendChild(wrap);
        }

        patron.items.forEach((entry) => {
          const value = typeof entry === 'string' ? entry : entry.value;
          const format = (typeof entry === 'string' ? patron.itemFormat : entry.format) || 'CODE128';
          const item = document.createElement('div'); item.className = 'barcode-item';
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          JsBarcode(svg, value, { format, lineColor: '#000', width: 2, height: 80, margin: 12, displayValue: true });
          item.appendChild(svg); section.appendChild(item);
        });

        patronsWrap.appendChild(section);
        if (index < patrons.length - 1) { const hr = document.createElement('hr'); hr.className = 'patron-separator'; patronsWrap.appendChild(hr); }
      });
    }

    function updatePatron(index, patch) {
      const data = getAllData();
      const loc = currentLocation();
      data[loc].patrons[index] = { ...data[loc].patrons[index], ...patch };
      saveAllData(data);
      addHistory(`Updated patron details`);
      renderPatrons();
    }

    function addPatron() {
      const data = getAllData();
      const loc = currentLocation();
      data[loc].patrons.unshift({ patronCode: patronCodeInput.value.trim(), patronName: patronNameInput.value.trim(), patronFormat: barcodeFormatInput.value, itemFormat: barcodeFormatInput.value, items: [] });
      saveAllData(data);
      addHistory(`Added patron ${patronCodeInput.value.trim() || '(no code)'}`);
      renderPatrons();
      error.textContent = '';
      barcodeInput.focus();
    }

    function addBarcodeItem() {
      const value = barcodeInput.value.trim();
      if (!value) return;
      const selectedFormat = barcodeFormatInput.value;
      if (selectedFormat === 'CODE128' && !/^\d+$/.test(value)) { error.textContent = 'For CODE128, use numbers only.'; return; }

      const data = getAllData();
      const loc = currentLocation();
      if (!data[loc].patrons.length) data[loc].patrons.unshift({ patronCode: patronCodeInput.value.trim(), patronName: patronNameInput.value.trim(), patronFormat: selectedFormat, itemFormat: selectedFormat, items: [] });
      data[loc].patrons[0].items.push({ value, format: selectedFormat });
      saveAllData(data);
      addHistory(`Added item ${value}`);
      renderPatrons();
      barcodeInput.value = '';
      barcodeInput.focus();
      error.textContent = '';
    }

    function exportCsv() {
      const { patrons } = locationData();
      const loc = currentLocation();
      const rows = [['location','patron_order','patron_code','patron_name','barcode_type','barcode_value','is_patron_barcode']];
      patrons.forEach((patron, idx) => {
        if (patron.patronCode) rows.push([loc, idx + 1, patron.patronCode || '', patron.patronName || '', patron.patronFormat || 'CODE128', patron.patronCode || '', 'yes']);
        patron.items.forEach((entry) => rows.push([loc, idx + 1, patron.patronCode || '', patron.patronName || '', entry.format || patron.itemFormat || 'CODE128', entry.value || entry, 'no']));
      });
      const csv = rows.map((r) => r.map((x) => `"${String(x).replaceAll('"','""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${loc.replace(/\s+/g,'_').toLowerCase()}_barcodes.csv`; a.click();
      addHistory('Exported CSV');
    }

    function exportToWord() {
      if (!patronsWrap.children.length) { error.textContent = 'Nothing to export.'; return; }
      const blob = new Blob(['\ufeff', `<!doctype html><html><body><h2>${currentLocation()}</h2>${patronsWrap.innerHTML}</body></html>`], { type: 'application/msword' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `${currentLocation().replace(/\s+/g,'_').toLowerCase()}_barcodes.doc`; a.click();
      addHistory('Exported Word');
    }

    function initLocations() {
      locationSelect.innerHTML = '';
      LOCATIONS.forEach((loc) => { const opt = document.createElement('option'); opt.value = loc; opt.textContent = loc; locationSelect.appendChild(opt); });
    }

    locationSelect.addEventListener('change', () => { renderPatrons(); renderHistory(); error.textContent = ''; barcodeInput.focus(); });
    addPatronBtn.addEventListener('click', addPatron);
    addBarcodeBtn.addEventListener('click', addBarcodeItem);
    exportCsvBtn.addEventListener('click', exportCsv);
    exportWordBtn.addEventListener('click', exportToWord);
    printBtn.addEventListener('click', () => window.print());
    clearLocationBtn.addEventListener('click', () => {
      const data = getAllData(); data[currentLocation()] = { patrons: [], history: [] }; saveAllData(data);
      renderPatrons(); renderHistory(); error.textContent = `Cleared ${currentLocation()} data.`;
    });
    barcodeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addBarcodeItem(); } });

    initLocations();
    saveAllData(getAllData());
    renderPatrons();
    renderHistory();
  </script>
</body>
</html>
