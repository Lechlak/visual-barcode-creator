<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Barcode Creator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1a1a1a; padding: 20px; }
    .card { width: min(1080px, 96vw); margin: 0 auto; background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 8px 25px rgba(0,0,0,.08); }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: end; }
    input, select { width: 100%; padding: 10px; border: 1px solid #b7bfd1; border-radius: 10px; box-sizing: border-box; }
    .controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
    button { padding:10px 14px; border:0; border-radius:10px; cursor:pointer; font-weight:600; background:#0066ff; color:#fff; }
    button.secondary { background:#5c657a; }
    .error { min-height: 1.2em; margin-top: 10px; color:#b00020; }
    .patron { margin-top: 18px; padding-top: 16px; border-top: 2px solid #d8deee; }
    .patron-head { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
    .badge { font-size:.85rem; color:#4a4a4a; background: #e0e5f0; padding: 4px 8px; border-radius: 4px; }
    .barcode-item { text-align:center; margin-bottom:16px; page-break-inside: avoid; }
    hr.patron-separator { border:none; border-top:2px dashed #aab4cc; margin:20px 0 0; }

    .hidden { display: none !important; }
    #currentPatronSummary { background: #eef2ff; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #c7d2fe; display: flex; align-items: center; justify-content: space-between; }
    #currentPatronSummary h3 { margin: 0; color: #3730a3; font-size: 16px; }
    #currentPatronSummary span { color: #4f46e5; font-weight: normal; margin-left: 10px; }

    @media print { .no-print { display:none !important; } .card { box-shadow:none; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Visual Barcode Creator</h1>
    <p>Location is dynamically set from the URL (e.g., <code>?location=Location1</code>). Start by entering Patron details.</p>

    <div class="no-print">
      <div id="locationDisplay" style="margin-bottom: 15px; font-weight: bold; color: #0066ff;"></div>

      <!-- Step 1: Patron Details Entry -->
      <div id="patronEntrySection">
        <div class="row" style="grid-template-columns: 1fr 1fr;">
          <input id="patronCodeInput" type="text" placeholder="Patron # / Barcode" />
          <input id="patronNameInput" type="text" placeholder="Patron name" />
        </div>
        <div class="controls">
          <button id="startPatronBtn" type="button">Start Patron</button>
        </div>
      </div>

      <!-- Step 2: Active Patron Summary (Editable) & Item Barcode Scanning -->
      <div id="activePatronSection" class="hidden">
        <div id="currentPatronSummary">
            <div>
                <h3>Active Patron: <span id="displayPatronName"></span> <span id="displayPatronCode"></span></h3>
            </div>
            <button id="editPatronBtn" type="button" class="secondary" style="padding: 5px 10px; font-size: 12px;">Edit</button>
        </div>

        <div class="row" style="grid-template-columns: 2fr 1fr;">
          <input id="barcodeInput" type="text" placeholder="Scan item barcode" />
          <select id="barcodeFormatInput">
            <option value="CODE128">CODE128</option>
            <option value="CODE39">CODE39</option>
          </select>
        </div>

        <div class="controls" style="margin-top: 10px;">
          <button id="addBarcodeBtn" type="button">Add Item</button>
          <button id="completePatronBtn" type="button" style="background: #10b981;">Complete & Add Patron</button>
        </div>
      </div>

      <div class="controls" style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
        <button id="printBtn" type="button" class="secondary">Print / Save PDF</button>
      </div>

      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </div>

    <!-- Active visually scanned items (cleared on complete) -->
    <section id="patronsWrap"></section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script>
    // URL Parameter parsing
    const urlParams = new URLSearchParams(window.location.search);
    const locationParam = urlParams.get('location') || 'Default Location';

    document.getElementById('locationDisplay').textContent = `Current Location: ${locationParam}`;

    // DOM Elements
    const patronEntrySection = document.getElementById('patronEntrySection');
    const activePatronSection = document.getElementById('activePatronSection');

    const patronCodeInput = document.getElementById('patronCodeInput');
    const patronNameInput = document.getElementById('patronNameInput');
    const startPatronBtn = document.getElementById('startPatronBtn');

    const displayPatronName = document.getElementById('displayPatronName');
    const displayPatronCode = document.getElementById('displayPatronCode');
    const editPatronBtn = document.getElementById('editPatronBtn');

    const barcodeInput = document.getElementById('barcodeInput');
    const barcodeFormatInput = document.getElementById('barcodeFormatInput');
    const addBarcodeBtn = document.getElementById('addBarcodeBtn');
    const completePatronBtn = document.getElementById('completePatronBtn');

    const printBtn = document.getElementById('printBtn');
    const error = document.getElementById('error');
    const patronsWrap = document.getElementById('patronsWrap');

    // State
    let currentPatron = null; // { code, name, items: [] }

    function renderActivePatronItems() {
        patronsWrap.innerHTML = '';
        if (!currentPatron) return;

        const section = document.createElement('section'); section.className = 'patron';
        const head = document.createElement('div'); head.className = 'patron-head';

        const badge = document.createElement('span'); badge.className = 'badge';
        badge.textContent = `${currentPatron.name || 'Unknown'} (${currentPatron.code || 'No Code'})`;
        head.appendChild(badge); section.appendChild(head);

        // Render patron barcode if exists
        if (currentPatron.code && /^\d+$/.test(currentPatron.code.trim())) {
          const wrap = document.createElement('div'); wrap.className = 'barcode-item';
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          JsBarcode(svg, currentPatron.code.trim(), { format: 'CODE128', lineColor: '#000', width: 2, height: 80, margin: 12, displayValue: true });
          wrap.appendChild(svg); section.appendChild(wrap);
        }

        // Render items
        currentPatron.items.forEach((entry) => {
          const item = document.createElement('div'); item.className = 'barcode-item';
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          JsBarcode(svg, entry.value, { format: entry.format, lineColor: '#000', width: 2, height: 80, margin: 12, displayValue: true });
          item.appendChild(svg); section.appendChild(item);
        });

        patronsWrap.appendChild(section);
    }

    // Step 1: Start Patron
    startPatronBtn.addEventListener('click', () => {
        const pCode = patronCodeInput.value.trim();
        const pName = patronNameInput.value.trim();

        if (!pCode && !pName) {
            error.textContent = "Please enter a patron name or code.";
            return;
        }

        if (currentPatron) {
            currentPatron.code = pCode;
            currentPatron.name = pName;
        } else {
            currentPatron = { code: pCode, name: pName, items: [] };
        }

        // Update UI
        error.textContent = "";
        displayPatronName.textContent = pName;
        displayPatronCode.textContent = pCode ? `[${pCode}]` : '';

        patronEntrySection.classList.add('hidden');
        activePatronSection.classList.remove('hidden');

        renderActivePatronItems();

        // Focus barcode input
        barcodeInput.focus();
    });

    // Handle enter key on Patron fields
    patronCodeInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') patronNameInput.focus(); });
    patronNameInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') startPatronBtn.click(); });


    // Step 2a: Edit Patron
    editPatronBtn.addEventListener('click', () => {
        patronEntrySection.classList.remove('hidden');
        activePatronSection.classList.add('hidden');
        patronCodeInput.focus();
    });

    // Step 2b: Add Item Barcode
    function addItem() {
        if (!currentPatron) return;
        const val = barcodeInput.value.trim();
        if (!val) return;

        const format = barcodeFormatInput.value;
        if (format === 'CODE128' && !/^\d+$/.test(val)) {
            error.textContent = 'For CODE128, use numbers only.';
            return;
        }

        currentPatron.items.push({ value: val, format: format });
        error.textContent = "";

        renderActivePatronItems();

        barcodeInput.value = '';
        barcodeInput.focus();
    }
    addBarcodeBtn.addEventListener('click', addItem);
    barcodeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addItem(); } });


    // Step 3: Complete & Save Patron
    completePatronBtn.addEventListener('click', async () => {
        if (!currentPatron) return;
        if (!currentPatron.code && currentPatron.items.length === 0) {
            error.textContent = "Nothing to save.";
            return;
        }

        completePatronBtn.disabled = true;
        completePatronBtn.textContent = 'Saving...';
        error.textContent = '';

        try {
            const response = await fetch('/.netlify/functions/save-batch', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    location: locationParam,
                    patronCode: currentPatron.code,
                    patronName: currentPatron.name,
                    items: currentPatron.items
                })
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || 'Server error');
            }

            // Success: Reset flow
            currentPatron = null;
            patronCodeInput.value = '';
            patronNameInput.value = '';
            barcodeInput.value = '';

            activePatronSection.classList.add('hidden');
            patronEntrySection.classList.remove('hidden');
            patronsWrap.innerHTML = '';

            error.style.color = '#10b981'; // Green temp message
            error.textContent = "Patron and items saved successfully!";
            setTimeout(() => {
                error.textContent = "";
                error.style.color = '#b00020';
            }, 3000);

            patronCodeInput.focus();

        } catch (err) {
            console.error(err);
            error.textContent = "Failed to save: " + err.message;
        } finally {
            completePatronBtn.disabled = false;
            completePatronBtn.textContent = 'Complete & Add Patron';
        }
    });

    // Print
    printBtn.addEventListener('click', () => window.print());

  </script>
</body>
</html>
