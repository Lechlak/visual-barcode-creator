<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Barcode Creator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1a1a1a; padding: 20px; }
    .card { width: min(1000px, 96vw); margin: 0 auto; background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 8px 25px rgba(0,0,0,.08); }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    input { width: 100%; padding: 10px; border: 1px solid #b7bfd1; border-radius: 10px; box-sizing: border-box; }
    .controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
    button { padding:10px 14px; border:0; border-radius:10px; cursor:pointer; font-weight:600; background:#0066ff; color:#fff; }
    button.secondary { background:#5c657a; }
    .error { min-height: 1.2em; margin-top: 10px; color:#b00020; }
    .patron { margin-top: 18px; padding-top: 16px; border-top: 2px solid #d8deee; }
    .patron-head { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
    .patron-head input { max-width: 260px; }
    .badge { font-size:.85rem; color:#4a4a4a; }
    .barcode-item { text-align:center; margin-bottom:16px; page-break-inside: avoid; }
    hr.patron-separator { border:none; border-top:2px dashed #aab4cc; margin:20px 0 0; }
    .history { margin-top: 18px; border-top: 1px solid #e0e5f0; padding-top: 12px; }
    @media print { .no-print { display:none !important; } .card { box-shadow:none; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Visual Barcode Creator</h1>
    <p>Newest patrons appear first. Add patron barcode/number or name, then add barcode items.</p>

    <div class="no-print">
      <div class="row">
        <input id="patronCodeInput" type="text" placeholder="Patron # / Barcode (editable)" />
        <input id="patronNameInput" type="text" placeholder="Patron name (editable)" />
        <input id="barcodeInput" type="text" inputmode="numeric" placeholder="Scan item barcode" />
      </div>
      <div class="controls">
        <button id="addPatronBtn" type="button" class="secondary">Add Patron</button>
        <button id="addBarcodeBtn" type="button">Add Barcode Item</button>
        <button id="exportWordBtn" type="button" class="secondary">Export Word (.doc)</button>
        <button id="printBtn" type="button" class="secondary">Print / Save PDF</button>
        <button id="clearCacheBtn" type="button" class="secondary">Clear Cache</button>
      </div>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </div>

    <section id="patronsWrap"></section>
    <section class="history no-print"><h2>Running Log</h2><ol id="historyList"></ol></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script>
    const patronCodeInput = document.getElementById('patronCodeInput');
    const patronNameInput = document.getElementById('patronNameInput');
    const barcodeInput = document.getElementById('barcodeInput');
    const addPatronBtn = document.getElementById('addPatronBtn');
    const addBarcodeBtn = document.getElementById('addBarcodeBtn');
    const exportWordBtn = document.getElementById('exportWordBtn');
    const printBtn = document.getElementById('printBtn');
    const clearCacheBtn = document.getElementById('clearCacheBtn');
    const patronsWrap = document.getElementById('patronsWrap');
    const historyList = document.getElementById('historyList');
    const error = document.getElementById('error');

    const STORAGE_KEYS = { patrons: 'barcode_creator_patrons', history: 'barcode_creator_history' };

    const readPatrons = () => JSON.parse(localStorage.getItem(STORAGE_KEYS.patrons) || '[]');
    const savePatrons = (patrons) => localStorage.setItem(STORAGE_KEYS.patrons, JSON.stringify(patrons));

    function addHistory(msg) {
      const history = JSON.parse(localStorage.getItem(STORAGE_KEYS.history) || '[]');
      history.unshift(`${new Date().toLocaleString()}: ${msg}`);
      localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(history.slice(0, 50)));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem(STORAGE_KEYS.history) || '[]');
      historyList.innerHTML = '';
      history.forEach((line) => { const li = document.createElement('li'); li.textContent = line; historyList.appendChild(li); });
    }

    function renderPatrons() {
      const patrons = readPatrons();
      patronsWrap.innerHTML = '';

      patrons.forEach((patron, index) => {
        const section = document.createElement('section');
        section.className = 'patron';

        const head = document.createElement('div');
        head.className = 'patron-head';

        const codeEdit = document.createElement('input');
        codeEdit.value = patron.patronCode || '';
        codeEdit.placeholder = 'Patron # / Barcode';
        codeEdit.addEventListener('change', () => updatePatron(index, { patronCode: codeEdit.value }));

        const nameEdit = document.createElement('input');
        nameEdit.value = patron.patronName || '';
        nameEdit.placeholder = 'Patron name';
        nameEdit.addEventListener('change', () => updatePatron(index, { patronName: nameEdit.value }));

        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = `Patron group ${patrons.length - index} (newest first)`;

        head.appendChild(codeEdit);
        head.appendChild(nameEdit);
        head.appendChild(badge);
        section.appendChild(head);

        if (/^\d+$/.test((patron.patronCode || '').trim())) {
          const patronSvgWrap = document.createElement('div');
          patronSvgWrap.className = 'barcode-item';
          const patronSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          JsBarcode(patronSvg, patron.patronCode.trim(), { format: 'CODE128', lineColor: '#000', width: 2, height: 80, margin: 12, displayValue: true });
          patronSvgWrap.appendChild(patronSvg);
          section.appendChild(patronSvgWrap);
        }

        patron.items.forEach((value) => {
          const item = document.createElement('div');
          item.className = 'barcode-item';
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          JsBarcode(svg, value, { format: 'CODE128', lineColor: '#000', width: 2, height: 80, margin: 12, displayValue: true });
          item.appendChild(svg);
          section.appendChild(item);
        });

        patronsWrap.appendChild(section);
        if (index < patrons.length - 1) {
          const hr = document.createElement('hr');
          hr.className = 'patron-separator';
          patronsWrap.appendChild(hr);
        }
      });
    }

    function updatePatron(index, patch) {
      const patrons = readPatrons();
      patrons[index] = { ...patrons[index], ...patch };
      savePatrons(patrons);
      addHistory(`Updated Patron ${patrons.length - index} details`);
      renderPatrons();
    }

    function addPatron() {
      const patrons = readPatrons();
      patrons.unshift({ patronCode: patronCodeInput.value.trim(), patronName: patronNameInput.value.trim(), items: [] });
      savePatrons(patrons);
      addHistory(`Added new patron ${patronCodeInput.value.trim() || '(no code)'}`);
      renderPatrons();
      barcodeInput.focus();
      error.textContent = '';
    }

    function addBarcodeItem() {
      const value = barcodeInput.value.trim();
      if (!/^\d+$/.test(value)) { error.textContent = 'Item barcode must be numbers only.'; return; }
      const patrons = readPatrons();
      if (!patrons.length) patrons.unshift({ patronCode: patronCodeInput.value.trim(), patronName: patronNameInput.value.trim(), items: [] });
      patrons[0].items.push(value);
      savePatrons(patrons);
      addHistory(`Added item ${value} to newest patron`);
      renderPatrons();
      error.textContent = '';
      barcodeInput.value = '';
      barcodeInput.focus();
    }

    function exportToWord() {
      if (!patronsWrap.children.length) { error.textContent = 'Nothing to export.'; return; }
      const blob = new Blob(['\ufeff', `<!doctype html><html><body>${patronsWrap.innerHTML}</body></html>`], { type: 'application/msword' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'patron-barcodes.doc'; a.click(); URL.revokeObjectURL(url);
    }

    addPatronBtn.addEventListener('click', addPatron);
    addBarcodeBtn.addEventListener('click', addBarcodeItem);
    exportWordBtn.addEventListener('click', exportToWord);
    printBtn.addEventListener('click', () => window.print());
    clearCacheBtn.addEventListener('click', () => { localStorage.removeItem(STORAGE_KEYS.patrons); localStorage.removeItem(STORAGE_KEYS.history); renderPatrons(); renderHistory(); error.textContent='Cache cleared.'; });
    barcodeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addBarcodeItem(); }});

    renderPatrons();
    renderHistory();
  </script>
</body>
</html>
